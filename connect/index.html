<!DOCTYPE html>
<html>
	<head>
		<title>Page Title</title>
		<link rel="stylesheet" href="styles.css">
		<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	</head>

	<body>

	
		Your name:
		<input id='name' type='text'>
		Your age:
		<input id='age' type='text'>
        Your gender:
		<input id='gender' type='text'>
        Your marital status. Are u single and ready to mingle, married, taken:
		<input id='marital_status' type='text'>
		Your address:
		<input id='address' type='text'>
        Your contact number:
		<input id='contact_number' type='text'>
		Your interest(hobbies):
		<input id='interest' type='text'>
		Your program:
        <input id='program' type='text'>
		Your year level:
		<input id='year_level' type='text'>
        Your career future path:
		<input id='career_path' type='text'>

		<button type="button" onclick="clickButton( 
			document.getElementById('name').value ,
			document.getElementById('age').value, 
			document.getElementById('gender').value,
			document.getElementById('marital_status').value,
			document.getElementById('address').value, 
			document.getElementById('contact_number').value,
			document.getElementById('interest').value, 
			document.getElementById('program').value, 
			document.getElementById('year_level').value,
			document.getElementById('career_path').value )">Click Me!</button>

		<script>

		
		const clickButton = (a,b,c,d,e,f,g,h,i,j) =>{

			const postData = {
				name:a,
				age:b,
				gender:c,
                marital_status:d,
				address:e,
				contact_number:f,
				interest:g,
                program:h,
				year_level:i,
				career_path:j
			};

			const data = {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify(postData)
			}
	
			async function fetchData() {
				try {
					const response = await fetch('http://127.0.0.1:8000/Survey',data);
					console.log(response)
					if (response.data.status =='success') {
						document.location.href = 'profile.html.html';
					} else {
						throw new Error('Failed to fetch data');
					}
				} catch (error) {
					console.error('Error:', error); 
				}
			}

			fetchData()
	
		}

		</script>
	</body>
</html>
